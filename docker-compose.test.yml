

services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_test
    ports:
      - "5433:5432"  # Use port 5433 to avoid conflict with your main DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]